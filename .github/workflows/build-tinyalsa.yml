name: build tinyalsa
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NDK r25c
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Clone tinyalsa official
        run: git clone https://github.com/tinyalsa/tinyalsa.git

      - name: CMake & Build static bin
        run: |
          cd tinyalsa
          mkdir build && cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-24 \
          -DBUILD_SHARED_LIBS=OFF \
          -DTINYALSA_BUILD_EXAMPLES=ON \
          ..
          make -j$(nproc)

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: tinyalsa-arm64-bin
          path: |
            tinyalsa/build/tinymix
            tinyalsa/build/tinyplay
            tinyalsa/build/tinycap
            tinyalsa/build/tinypcminfo
