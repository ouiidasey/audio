name: build tinyalsa

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Native Git Clone (绕过 Checkout Action)
        run: |
          git config --global init.defaultBranch main
          git init
          git remote add origin https://github.com/oulidasey/audio.git
          git fetch --depth 1 origin main
          git checkout main
          
          git submodule update --init --recursive

      - name: Setup NDK r25c
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          local-cache: true

      - name: Download tinyalsa source
        run: |
          set -e
          # 检查系统是否存在 wget，若没有则使用 curl
          if command -v wget &> /dev/null; then
            wget --retry-connrefused --waitretry=3 --tries=3 \
              https://github.com/tinyalsa/tinyalsa/archive/refs/tags/1.2.0.tar.gz \
              -O tinyalsa-1.2.0.tar.gz
          else
            curl -L --retry 3 -o tinyalsa-1.2.0.tar.gz \
              https://github.com/tinyalsa/tinyalsa/archive/refs/tags/1.2.0.tar.gz
          fi

          mkdir -p tinyalsa
          tar -xf tinyalsa-1.2.0.tar.gz --strip-components=1 -C tinyalsa
          
          # 打印文件结构，验证下载是否成功
          echo "=== Checking tinyalsa directory ==="
          ls -R tinyalsa | head -20

      - name: CMake & Build
        run: |
          cd tinyalsa
          mkdir -p build && cd build
          
          echo "Building with NDK: ${{ steps.ndk.outputs.ndk-path }}"
          cmake -DCMAKE_TOOLCHAIN_FILE=${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DTINYALSA_BUILD_EXAMPLES=ON \
            ..
          make -j$(nproc)

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: tinyalsa-arm64-api24-static
          path: |
            tinyalsa/build/tinymix
            tinyalsa/build/tinyplay
            tinyalsa/build/tinycap
            tinyalsa/build/tinypcminfo
