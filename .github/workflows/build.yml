name: build tinyalsa

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # 既然官方 checkout action 在 Node 24 下会报 exit code 4，
      # 我们直接绕过它，用原生的 git 命令拉取代码！
      - name: Git Clone (代替官方 checkout)
        run: |
          # 设置 Git 全局凭据（避免报错）
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          # 拉取主分支
          git clone --branch main --depth 1 https://github.com/oulidasey/audio.git .
          git submodule update --init --recursive

      - name: Setup NDK r25c
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          local-cache: true

      - name: Download tinyalsa
        run: |
          set -e
          wget --retry-connrefused --waitretry=3 --tries=3 https://github.com/tinyalsa/tinyalsa/archive/refs/tags/1.2.0.tar.gz -O tinyalsa-1.2.0.tar.gz
          mkdir -p tinyalsa
          tar -xf tinyalsa-1.2.0.tar.gz --strip-components=1 -C tinyalsa

      - name: CMake & Build
        run: |
          cd tinyalsa
          mkdir -p build && cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DTINYALSA_BUILD_EXAMPLES=ON \
            ..
          make -j$(nproc)

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: tinyalsa-arm64-api24-static
          path: |
            tinyalsa/build/tinymix
            tinyalsa/build/tinyplay
            tinyalsa/build/tinycap
            tinyalsa/build/tinypcminfo
