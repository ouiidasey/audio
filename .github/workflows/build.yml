name: Build tinyalsa-1.1.1
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y build-essential cmake ninja-build

      - name: Download NDK r25c
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r25c-linux.zip -O ndk.zip
          unzip -q ndk.zip
          echo "NDK_PATH=$PWD/android-ndk-r25c" >> $GITHUB_ENV

      - name: Clone tinyalsa 1.1.1（无tinyhostless）
        run: |
          git clone https://github.com/tinyalsa/tinyalsa.git tinyalsa
          cd tinyalsa
          git checkout 1.1.1

      - name: CMake build
        run: |
          cd tinyalsa
          mkdir build && cd build
          cmake -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=${{ env.NDK_PATH }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF ..
          ninja
          ${{ env.NDK_PATH }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip tinycap tinymix tinyplay tinypcminfo

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tinyalsa-1.1.1-arm64-android24
          path: |
            tinyalsa/build/tinymix
            tinyalsa/build/tinycap
            tinyalsa/build/tinyplay
            tinyalsa/build/tinypcminfo
