name: build tinyalsa

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # 使用最标准的官方 checkout action，不依赖任何 Node 版本警告
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup NDK r25c
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          local-cache: true

      - name: Download tinyalsa
        run: |
          set -e
          wget --retry-connrefused --waitretry=3 --tries=3 https://github.com/tinyalsa/tinyalsa/archive/refs/tags/1.2.0.tar.gz -O tinyalsa-1.2.0.tar.gz
          mkdir -p tinyalsa
          tar -xf tinyalsa-1.2.0.tar.gz --strip-components=1 -C tinyalsa

      - name: CMake & Build
        run: |
          cd tinyalsa
          mkdir -p build && cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DTINYALSA_BUILD_EXAMPLES=ON \
            ..
          make -j$(nproc)

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: tinyalsa-arm64-api24-static
          path: |
            tinyalsa/build/tinymix
            tinyalsa/build/tinyplay
            tinyalsa/build/tinycap
            tinyalsa/build/tinypcminfo
