name: build tinyalsa

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # 1. 彻底跳过 git clone，直接使用虚拟机已拉取的默认代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 直接使用 ubuntu-22.04 虚拟机自带的 Android NDK (r25b)
      - name: Setup NDK
        id: ndk
        run: |
          # ubuntu-22.04 默认自带了 NDK r25b
          # 直接使用系统自带路径即可
          echo "NDK_PATH=/usr/local/lib/android/sdk/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "System NDK r25b ready."

      # 3. 下载 tinyalsa 源码并解压
      - name: Download tinyalsa source
        run: |
          set -e
          wget --retry-connrefused --waitretry=3 --tries=3 \
            https://github.com/tinyalsa/tinyalsa/archive/refs/tags/1.2.0.tar.gz \
            -O tinyalsa-1.2.0.tar.gz
          
          mkdir -p tinyalsa
          tar -xf tinyalsa-1.2.0.tar.gz --strip-components=1 -C tinyalsa
          echo "tinyalsa source ready."

      # 4. 使用 CMake 进行交叉编译
      - name: CMake & Build
        run: |
          set -e
          cd tinyalsa
          mkdir -p build && cd build
          
          echo "Starting CMake build with system NDK: $NDK_PATH"
          cmake -DCMAKE_TOOLCHAIN_FILE=${NDK_PATH}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DTINYALSA_BUILD_EXAMPLES=ON \
            ..
          
          make -j$(nproc)

      # 5. 上传编译好的二进制文件
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: tinyalsa-arm64-api24-static
          path: |
            tinyalsa/build/tinymix
            tinyalsa/build/tinyplay
            tinyalsa/build/tinycap
            tinyalsa/build/tinypcminfo
