name: build tinyalsa
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Android NDK r25c
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          local-cache: true

      - name: Clone tinyalsa source
        run: git clone --depth=1 https://github.com/tinyalsa/tinyalsa.git

      - name: CMake & Build static bin
        run: |
          cd tinyalsa
          mkdir build && cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=$NDK_PATH/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=arm64-v8a \
                -DANDROID_PLATFORM=android-24 \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
                ..
          make -j$(nproc)

      - name: Upload compiled binaries
        uses: actions/upload-artifact@v4
        with:
          name: tinyalsa-arm64-bin
          path: |
            tinyalsa/build/tinymix
            tinyalsa/build/tinyplay
            tinyalsa/build/tinycap
            tinyalsa/build/tinypcminfo
